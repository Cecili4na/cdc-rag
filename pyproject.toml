[project]
name = "cdc-rag"
version = "0.1.0"
description = "Perguntas sobre o Código de Defesa do Consumidor com busca híbrida, citação obrigatória e avaliação"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
cdc = "cdc_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["FLY002"]
